# References to Keycloak's OWN built-in administrative roles — what a user can do in
# Keycloak itself (the IAM/SSO system), not an application-level permission. These
# already exist automatically on every realm's built-in "realm-management" client; they
# are looked up (data source), never created. Pick names from Keycloak's own role list,
# e.g.: realm-admin, manage-users, view-users, manage-clients, view-clients,
# manage-realm, view-realm, manage-identity-providers, manage-authorization.
iam_roles:
  - manage-users
  - view-users
