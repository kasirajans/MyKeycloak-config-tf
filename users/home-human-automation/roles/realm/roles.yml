# Global (realm) roles — apply across the whole home-human-automation realm, not scoped
# to any one app/client. Created as keycloak_role resources with no client_id.
roles:
  - name: resident
    description: >-
      Full resident access to home automation. Auto-granted to every member of a
      home's group (see main.tf) — do not also list this individually on a resident's
      own roles: unless they're not a group member for some reason.

  - name: guest
    description: Limited, temporary access.

  # Assigned individually (account_type: owner) to whichever resident(s) administer a
  # given home — not auto-granted by group membership, since not every resident of a
  # home is its admin. "Admin of which home" = this role + the admin's own
  # home1/home2/... group membership; the consuming app must check both claims
  # together — Keycloak records them separately, it doesn't fuse them into one
  # permission on its own.
  - name: home-admin
    description: >-
      Administrative access to a home's automation UI/settings. Scoped to a home only
      in combination with that user's home group membership.
