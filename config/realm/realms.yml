realms:
  - realm: customer
    enabled: true
    display_name: Customer
    # PKCE, human, self-service signup — customers register themselves.
    registration_allowed: true
    reset_password_allowed: true
    remember_me: true
    verify_email: true
    login_with_email_allowed: true
    ssl_required: external
    access_token_lifespan: 5m

  - realm: home-human-automation
    enabled: true
    display_name: Home Human Automation
    # PKCE, human, but residents are owner-provisioned via app/homeAutomation/users/
    # (see its README: owner-reviewed only, never self-service) — so registration is
    # off even though this is a human realm, unlike customer.
    registration_allowed: false
    reset_password_allowed: true
    remember_me: true
    verify_email: true
    login_with_email_allowed: true
    ssl_required: external
    access_token_lifespan: 5m

  - realm: ai-agent
    enabled: true
    display_name: AI Agent
    # No client in this realm ever drives a browser login flow (M2M / client_credentials
    # and same-realm token exchange only), so self-service/login features are locked off.
    registration_allowed: false
    reset_password_allowed: false
    remember_me: false
    verify_email: false
    login_with_email_allowed: false
    ssl_required: all
    access_token_lifespan: 2m
